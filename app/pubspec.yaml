name: zeibun
description: 税制法令を e-Gov 法令API v2 から最新化し、端末内で検索・閲覧する Flutter アプリ。
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  zeibun_core:
    path: ../packages/zeibun_core
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  dio: ^5.7.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  scrollable_positioned_list: ^0.3.8
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
