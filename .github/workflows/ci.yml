name: CI

# Actions をタグ（@v2 など）で指定しないのは、タグは付け替えられ、気づかないうちに
# 別の中身で動くため

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-core:
    name: zeibun_core / spike (pure Dart)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [packages/zeibun_core, spike]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  # コアは Web でも動くことを保証する（設計書 §9: Web 版は当面作らないが CI で維持）
  dart-core-web:
    name: zeibun_core on Chrome
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zeibun_core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - run: dart pub get
      # フィクスチャを読むテストは @TestOn('vm') で自ら外れるので、ファイルを列挙しない
      - run: dart test --platform chrome

  flutter-app:
    name: app (analyze / test / build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      # 証明書検証を緩めるコードと dart:io を、アプリの lib に入れない（設計書 §11 S / §9）
      - name: forbid certificate overrides and dart:io in lib
        # `! grep` は errexit の対象外で最後の行しか効かないので、if で明示的に落とす
        run: |
          if grep -rn "badCertificateCallback\|allowBadCertificates\|SecurityContext" lib; then
            echo "certificate validation must not be relaxed"; exit 1
          fi
          if grep -rn "^import 'dart:io'" lib ../packages/zeibun_core/lib; then
            echo "dart:io is not allowed in lib (Web build)"; exit 1
          fi
      - run: flutter test --timeout 60s
      # Web 版は当面出さないが、Web で動く状態を保つ（設計書 §9）
      - run: flutter build web --release

  # Android は v1 では出さず手元でも組まないので、Gradle / AGP / Kotlin の更新で
  # 静かに壊れるのを PR で検知する（設計書 §13 Phase R R11）。iOS は macOS ランナーが
  # 要るので手元でビルドする
  flutter-android:
    name: app (build apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # 1 ABI に絞るのは、SQLite を hooks でコンパイルするので ABI ごとに時間がかかるため
      - run: flutter build apk --debug --target-platform android-arm64
